# YOLOv8n-seg + CBAM Attention
# 在 Backbone 关键层后插入 CBAM，增强杂草纹理特征提取
# nc: 2  # classes: crop, weed (由 data.yaml 覆盖)

# Parameters
nc: 2  # 棉花 + 杂草
scales:
  n: [0.33, 0.25, 1024]

# YOLOv8.0n-seg backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 3, C2f, [128, True]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, C2f, [256, True]]              # 4
  - [-1, 1, CBAM, [256]]                    # 5-CBAM after P3
  - [-1, 1, Conv, [512, 3, 2]]             # 6-P4/16
  - [-1, 6, C2f, [512, True]]              # 7
  - [-1, 1, CBAM, [512]]                    # 8-CBAM after P4
  - [-1, 1, Conv, [1024, 3, 2]]            # 9-P5/32
  - [-1, 3, C2f, [1024, True]]             # 10
  - [-1, 1, SPPF, [1024, 5]]               # 11
  - [-1, 1, CBAM, [1024]]                   # 12-CBAM after SPPF

# YOLOv8.0n-seg head
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                          # 13
  - [[-1, 7], 1, Concat, [1]]                                          # 14  cat with P4 feature (backbone[7])
  - [-1, 3, C2f, [512]]                                                # 15
  - [-1, 1, CBAM, [512]]                                   # 16-CBAM after P4 up-concat

  - [-1, 1, nn.Upsample, [None, 2, nearest]]                          # 17
  - [[-1, 4], 1, Concat, [1]]                                          # 18  cat with P3 feature (backbone[4])
  - [-1, 3, C2f, [256]]                                                # 19
  - [-1, 1, CBAM, [256]]                                   # 20-CBAM after P3 up-concat

  - [-1, 1, Conv, [256, 3, 2]]                                         # 21
  - [[-1, 15], 1, Concat, [1]]                                         # 22  cat with head[15]
  - [-1, 3, C2f, [512]]                                                # 23
  - [-1, 1, CBAM, [512]]                                   # 24-CBAM after N4 down

  - [-1, 1, Conv, [512, 3, 2]]                                         # 25
  - [[-1, 12], 1, Concat, [1]]                                         # 26  cat with backbone[12] (CBAM after SPPF)
  - [-1, 3, C2f, [1024]]                                               # 27
  - [-1, 1, CBAM, [1024]]                                  # 28-CBAM after N5 down

  - [[19, 23, 27], 1, Segment, [nc, 32, 256]]                         # 29